<hr>
    <h2>Register for the Fest</h2>
    <form action="register">    
        <label for="name">Name:</label>
        <input type="text" name="name" placeholder="Enter your name" required minlength="3" maxlength="50">

        <br><br>
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>
        <select name="tshirt size" id="tshirt-size" required>
            <option value="">Select a t-shirt size</option>
            <option value="s">Small</option>
            <option value="m">Medium</option>
            <option value="l">Large</option>
            <option value="xl">Extra Large</option>
        </select>
        
    <br><br>
    <label for ="terms">
        <input type="checkbox" name="terms" required> I agree to the terms and conditions</label>
        <br><br>
        <label for="alumni">alumni:</label><br>
        <input type="radio" name="attend_type" value="alumni"> Alumni
        <label for="student">student:</label><br>
        <input type="radio" name="attend_type" value="student"> Student
        <br><br>
        <button type="submit">Register</button>
    </form>
